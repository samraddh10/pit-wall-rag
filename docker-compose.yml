# Local development database: PostgreSQL 17 with the pgvector extension installed.
# Start it with `docker compose up -d`, stop it with `docker compose down`.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
      POSTGRES_DB: pitwall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall -d pitwall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
